<svg width="100%" viewBox="0 0 1280 280" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>alex de souza, Founding Engineer, Developer, AI Engineer</title>
  <desc>GitHub banner for alex de souza with certifications and stack</desc>
  <style>
    .bg{fill:#F2F3F0}
    .ink{fill:#1B1E22}
    .soft{fill:#4E545B}
    .muted{fill:#8A8F94}
    .accent{fill:#2F5E5A}
    .rule{stroke:#C9CCC7}
    .accent-rule{stroke:#2F5E5A}
    .serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .bg{fill:#12161B}
      .ink{fill:#ECEAE4}
      .soft{fill:#B3B7BB}
      .muted{fill:#7C8288}
      .accent{fill:#7FB3AC}
      .rule{stroke:#2A3038}
      .accent-rule{stroke:#7FB3AC}
    }
  </style>

  <rect class="bg" width="1280" height="280" rx="14"/>

  <!-- Left: identity -->
  <text class="serif ink" x="80" y="160" font-size="96" letter-spacing="-2.5">alex de souza</text>
  <line class="accent-rule" x1="84" y1="186" x2="124" y2="186" stroke-width="1.5"/>
  <text class="sans soft" x="84" y="222" font-size="18" letter-spacing="0.4">
    Founding Engineer<tspan class="muted" dx="14">/</tspan><tspan dx="14">Developer</tspan><tspan class="muted" dx="14">/</tspan><tspan dx="14">AI Engineer</tspan>
  </text>

  <!-- Divider -->
  <line class="rule" x1="830" y1="64" x2="830" y2="216" stroke-width="1"/>

  <!-- Right: details -->
  <text class="serif accent" x="872" y="96" font-size="17" font-style="italic">Certifications</text>
  <text class="sans soft" x="872" y="124" font-size="16">Microsoft, IBM, NASA</text>
  <text class="sans soft" x="872" y="148" font-size="16">Duke MLOps, UoL Mathematics</text>

  <text class="serif accent" x="872" y="190" font-size="17" font-style="italic">Stack</text>
  <text class="sans soft" x="872" y="218" font-size="16">Next.js, TypeScript, Claude SDK, Prisma</text>
</svg>
